name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly canary against the live MOPS endpoint. Its assumptions are the
    # ones most likely to rot, and a scheduled failure is how we find out.
    - cron: "0 2 * * 1"

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -v

  live:
    # Only on the weekly schedule: MOPS should not be hit on every push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m unittest tests.test_smoke_network -v
        env:
          RUN_NETWORK_TESTS: "1"
