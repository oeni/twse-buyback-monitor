[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twse-buyback-monitor"
version = "1.1.0"
description = "Write daily reports for Taiwan-listed share buyback filings from MOPS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "oeni" }]
keywords = ["taiwan", "stock", "buyback", "twse", "mops", "finance", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/oeni/twse-buyback-monitor"
Issues = "https://github.com/oeni/twse-buyback-monitor/issues"

[project.scripts]
twse-buyback-monitor = "twse_buyback.cli:main"

[tool.setuptools.packages.find]
include = ["twse_buyback*"]
